<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Käyrä cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  /* 1920x1080 cover: faceplate left with the name, LCD right with the real curve and days */
  :root { --plate: #3a2a57; --gold: #e0b743; --glass: #b9d63a; --ink: #17240a; --dim: #55701a; --key: #c3d4ea; --key-ink: #1f3f93; --housing: #8c8f8e; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: var(--housing); overflow: hidden; }
  .plate { position: absolute; inset: 40px; background: var(--plate); border-radius: 22px; display: grid; grid-template-columns: 720px 1fr; gap: 40px; padding: 70px; box-sizing: border-box; }
  .left { display: flex; flex-direction: column; justify-content: space-between; color: var(--gold); }
  h1 { font: 700 190px/0.9 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .04em; margin: 0; }
  .sub { font: 500 46px/1.2 "IBM Plex Sans Condensed", sans-serif; letter-spacing: .02em; max-width: 620px; margin-top: 28px; }
  .tags { display: flex; flex-wrap: wrap; gap: 14px; }
  .tags span { font: 600 26px/1 "IBM Plex Sans Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--key-ink); background: var(--key); border-radius: 999px; padding: 14px 24px; }
  .lcd { background: var(--glass); border-radius: 6px; box-shadow: inset 0 0 0 6px #2a1f40, inset 0 8px 30px rgba(0,0,0,.25); position: relative; }
  svg { position: absolute; inset: 30px; width: calc(100% - 60px); height: calc(100% - 60px); }
  svg text { font: 24px "Share Tech Mono", monospace; fill: var(--dim); }
</style>
</head>
<body>
<div class="plate">
  <div class="left">
    <div>
      <h1>KÄYRÄ</h1>
      <div class="sub">What is the undocumented controller doing? Found from the room data a site already logs.</div>
    </div>
    <div class="tags"><span>AMD</span><span>LLM writes hypotheses</span><span>Fitter decides</span><span>Live HA data</span></div>
  </div>
  <div class="lcd"><svg id="c" viewBox="0 0 1000 820" preserveAspectRatio="none"></svg></div>
</div>
<script>
(async () => {
  const pts = await (await fetch("artifacts/points.json")).json();
  const real = await (await fetch("artifacts/real.json")).json();
  const svg = document.getElementById("c");
  const X = (t) => 60 + ((20 - t) / 40) * 900;            // +20 left to -20 right, as heating curves are printed
  const Ys = (v) => 380 - ((v - 20) / 60) * 340;          // supply 20..80
  const Yr = (v) => 780 - ((v - 19) / 7) * 330;           // room 19..26
  let s = "";
  for (const t of [20, 10, 0, -10, -20]) s += `<text x="${X(t) - 14}" y="810">${t}</text>`;
  s += `<text x="60" y="30">supply °C</text><text x="60" y="440">room °C</text>`;
  const cols = ["#17240a", "#1f3f93", "#9a2f0c"], rooms = ["kitchen", "fireplace", "tv"];
  rooms.forEach((r, i) => { for (const d of pts.days) if (d[r] != null && d.out <= 20 && d.out >= -20) s += `<circle cx="${X(d.out)}" cy="${Yr(d[r])}" r="4" fill="${cols[i]}" opacity=".55"/>`; });
  for (const [lid, L] of Object.entries(real.simple || {})) {
    const th = L.theta; let d = "";
    for (let t = 20; t >= -20; t -= 0.5) { const v = th.level + th.slope * t; if (t >= th.cutoff || v < 20 || v > 80) continue; d += (d ? "L" : "M") + X(t) + "," + Ys(v); }
    s += `<path d="${d}" fill="none" stroke="#17240a" stroke-width="${lid === "up" ? 6 : 3}" ${lid === "up" ? "" : 'stroke-dasharray="10 8"'}/>`;
  }
  svg.innerHTML = s;
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
